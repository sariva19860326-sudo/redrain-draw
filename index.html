<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>百分百寵物 11週年慶紅包雨</title>
<style>
:root{--bg:#f8eae1;--card:#fff;--tx:#3a1c14;--mut:#8a6a60;--red:#d62828;--gold:#f7b32b;--bd:#f0d9cc;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root{--bg:#1d1210;--card:#2a1a17;--tx:#fbeee8;--mut:#c0a096;--bd:#4a2e28}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:440px;margin:0 auto;padding:12px 16px 40px}
.hero-card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(214,40,40,.12);border:1px solid var(--bd);margin-bottom:16px}
.hero-img{width:100%;display:block;border-bottom:1px solid var(--bd)}
.action-box{padding:20px 18px;text-align:center}
#store{font-size:18px;font-weight:800;color:var(--red);margin-bottom:6px}
.sub-title{font-size:13px;color:var(--mut);margin-bottom:14px;line-height:1.4}
button{width:100%;font:inherit;font-weight:800;font-size:20px;padding:14px;border-radius:12px;border:0;background:linear-gradient(135deg,#e63946,#d62828);color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(214,40,40,.35);transition:transform .1s}
button:active{transform:scale(.98)}button:disabled{opacity:.5;box-shadow:none}
#res{text-align:center;margin-top:10px;min-height:20px;font-size:14px;color:var(--red);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
#game,#result{position:fixed;inset:0;z-index:9}#game{background:linear-gradient(#6d0b13,#c1121f)}
#cv{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px;color:#fff;font-weight:700;font-size:20px;pointer-events:none}
#result{background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px}
.rbox{background:var(--card);border:3px solid var(--gold);border-radius:18px;padding:24px 20px;width:100%;max-width:340px;text-align:center}
#rt{font-size:18px;color:var(--mut)}#rp{font-size:22px;font-weight:700;margin:10px 0;color:var(--red)}[hidden]{display:none!important}
#intro,#rp{white-space:pre-line}.lk,#rl{display:block;margin-top:14px;padding:12px;border-radius:10px;background:var(--gold);color:#3a1c14;font-weight:700;text-decoration:none;text-align:center}
</style></head><body>
<main>
<div class="hero-card">
  <!-- 相容 hero.jpg.jpg 與 hero.jpg -->
  <img src="hero.jpg.jpg" class="hero-img" alt="百分百寵物11週年慶滿額抽紅包" onerror="if(this.src.indexOf('hero.jpg.jpg')!==-1)this.src='hero.jpg';">
  
  <div class="action-box">
    <div id="tb" hidden style="background:#fff0c2;color:#5a4300;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px">🧪 測試模式：結果不扣正式獎池<select id="force" style="margin-top:6px;width:100%"></select></div>
    <div id="store">載入門市中…</div>
    <div class="sub-title" id="intro">本頁僅限本次消費滿額顧客使用。<br>點擊天上掉下來的紅包揭曉獎項！</div>
    <button id="go">抽紅包</button>
    <div id="res"></div>
  </div>
</div>

<div class="card" id="last" hidden>
  <h2 style="font-size:15px;margin:0 0 6px;color:var(--mut)">您上次抽到的獎項</h2>
  <div id="lastp" style="font-weight:800;font-size:18px;color:var(--red)"></div>
  <a id="lastl" class="lk" hidden target="_blank" rel="noopener">前往領取折價券</a>
</div>
</main>

<div id="game" hidden><canvas id="cv"></canvas><div id="hud"><span id="tm"></span><span id="cnt"></span></div></div>
<div id="result" hidden><div class="rbox"><div id="rt"></div><img id="rimg" style="max-width:180px;max-height:180px;margin:12px auto;display:none;border-radius:10px;object-fit:contain;" onerror="this.style.display='none';"><div id="rp"></div><a id="rl" hidden target="_blank" rel="noopener">前往領取折價券</a><button id="rb" style="margin-top:10px"></button></div></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,getDocs,query,where,limit,writeBatch,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';

const DUR=10;
const app=initializeApp(firebaseConfig),au=getAuth(app),db=getFirestore(app);
const ready=new Promise(r=>onAuthStateChanged(au,u=>u&&r(u)));signInAnonymously(au).catch(()=>{});
const $=s=>document.querySelector(s),q=new URLSearchParams(location.search);
const rawSrc=q.get('utm_source')||q.get('ref')||q.get('src')||'direct';
const src=rawSrc.slice(0,40);
const store=(q.get('s')||q.get('store')||'').toUpperCase(),testCode=(q.get('test_code')||'').toLowerCase();
let canDraw=!!store||!!testCode,busy=false,PR=[],TL=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const okUrl=u=>/^https?:\/\//i.test(u||'');

const dayNum=()=>Math.floor((Date.now()+28800000)/86400000);
const stop=m=>{$('#store').textContent=m;canDraw=false;$('#go').disabled=true};

if(!store && !testCode){
  stop('請掃描門市提供的 QR code 進入抽獎');
} else if(store){
  $('#store').textContent = '門市代碼：' + store;
}

// 防刷檢查：如果當前分頁已經抽過，更新提示文字
if(sessionStorage.getItem('has_drawn_in_session') === 'true') {
  stop('本次抽紅包已完成！');
}

if(testCode){
  $('#tb').hidden=false;$('#store').textContent='測試模式';
  getDoc(doc(db,'testLinks',testCode)).then(s=>{TL=s.data();if(!TL)throw 0}).catch(()=>stop('測試連結無效或已過期'));
} else if(store) {
  Promise.all([getDoc(doc(db,'stores',store)),getDoc(doc(db,'settings','main'))]).then(([s,m])=>{
    const d=s.data();
    if(m.exists() && m.data()?.enabled===false) stop('抽獎活動目前暫停，請洽門市人員');
    else if(d && d.enabled===false) stop('此門市目前未開放抽獎');
    else if(d && d.name) $('#store').textContent='門市：'+d.name;
  }).catch(e=>{ console.log('Store info error:', e); });
}

getDocs(collection(db,'prizes')).then(s=>{
  PR=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.qty>0&&b.qty>0?a.qty-b.qty:b.qty-a.qty);
  if(testCode)$('#force').innerHTML='<option value="">隨機（依機率）</option>'+PR.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
}).catch(()=>{});

getDoc(doc(db,'settings','texts')).then(s=>{
  const t=s.data()||{};
  if(t.intro!=null)$('#intro').textContent=t.intro;
  if(t.btn)$('#go').textContent=t.btn;
}).catch(()=>{});

async function claim(){
  const u=await ready;
  const mainDoc = await getDoc(doc(db,'settings','main'));
  const L0 = mainDoc.exists() ? (mainDoc.data()?.daily_limit ?? 1) : 1;
  const L = L0===0 ? 20 : L0;
  const poolDoc = await getDoc(doc(db,'meta','pool'));
  const pool = poolDoc.exists() ? poolDoc.data() : null;
  if(!pool||!pool.size)return{err:'活動尚未開始（請至後台產生獎位）'};
  
  const day=dayNum();
  let k=0;
  for(let i=1;i<=L;i++){
    const existsSnap = await getDoc(doc(db,'deviceDay',`${u.uid}_${day}_${i}`));
    if(!existsSnap.exists()){k=i;break;}
  }
  if(!k)return{err:`這支手機今天已抽過 ${L} 次，明天再來！`};
  
  const size = Number(pool.size);
  let startN = Math.floor(Math.random() * size) + 1;
  
  for(let t=0;t<20;t++){
    const slotId = String((startN + t - 1) % size + 1);
    const b = writeBatch(db);
    
    b.set(doc(db,'claims',slotId),{
      uid: u.uid,
      store: store,
      day: day,
      k: Number(k),
      src: src,
      ts: serverTimestamp()
    });
    
    b.set(doc(db,'deviceDay',`${u.uid}_${day}_${k}`),{
      uid: u.uid
    });
    
    try{
      await b.commit();
      sessionStorage.setItem('has_drawn_in_session', 'true');
      return { n: slotId };
    }catch(e){
      console.warn('Attempt', t, 'failed for slot', slotId, e);
      if(e.code==='permission-denied') continue;
      return{err:'連線失敗，請稍後再試'};
    }
  }
  return{err:'紅包已被搶先領取完畢，請再試一次！'};
}

function testDraw(){
  const pool=PR.filter(p=>p.w>0),f=PR.find(p=>p.id===$('#force').value);let p=f;
  if(!p){if(!pool.length)return{err:'尚未設定獎項'};let r=Math.random()*pool.reduce((a,x)=>a+x.w,0);p=pool.find(x=>(r-=x.w)<0)||pool[pool.length-1]}
  return{ok:1,test:1,prize:p.name,img:p.img||'',link:(TL.links||{})[p.id]||null}
}

function showResult(d){
  const R=$('#result'),rb=$('#rb'),rl=$('#rl'),rimg=$('#rimg');
  R.hidden=false;rb.hidden=false;rl.hidden=true;$('#rp').style.fontSize='';rb.textContent='關閉';
  rb.onclick=()=>{
    R.hidden=true;
    stop('本次抽紅包已完成！');
  };
  if(d.ok){
    $('#rt').textContent=(d.test?'（測試）':'')+'🎉 恭喜獲得';
    $('#rp').textContent=d.prize;
    if(d.img){
      let imgSrc = d.img;
      if(imgSrc === 'popcorn.png' || imgSrc === 'popcorn.jpg') imgSrc = 'popcorn.png.jpg';
      rimg.src = imgSrc;
      rimg.style.display = 'block';
    }else{
      rimg.style.display = 'none';
    }
    if(okUrl(d.link)){rl.href=d.link;rl.hidden=false;}
  }else{
    $('#rt').textContent='很可惜';
    $('#rp').textContent=d.err || '發生錯誤';
    rimg.style.display='none';
    $('#rp').style.fontSize='16px';
  }
}

async function reveal(n){
  const rb=$('#rb');$('#result').hidden=false;$('#rt').textContent='結算中…';$('#rp').textContent='';$('#rl').hidden=true;rb.hidden=true;$('#rimg').style.display='none';
  let d=null;try{d=(await getDoc(doc(db,'queue',String(n)))).data()}catch(e){}
  if(!d){$('#rt').textContent='連線失敗';$('#rp').textContent='您的紅包已保留，請重試';rb.hidden=false;rb.textContent='重新取得結果';rb.onclick=()=>reveal(n);return}
  showResult({ok:1,prize:d.name,img:d.img||'',link:d.link});loadLast();
}

async function loadLast(){try{const u=await ready;
  const s=await getDocs(query(collection(db,'claims'),where('uid','==',u.uid),limit(20)));
  const c=s.docs.map(d=>({n:d.id,...d.data()})).filter(x=>x.ts).sort((a,b)=>b.ts.toMillis()-a.ts.toMillis())[0];
  if(!c||Date.now()-c.ts.toMillis()>30*864e5)return;
  const d=(await getDoc(doc(db,'queue',c.n))).data();if(!d)return;
  $('#last').hidden=false;$('#lastp').textContent=d.name;const a=$('#lastl');a.hidden=!okUrl(d.link);if(okUrl(d.link))a.href=d.link}catch(e){}}
loadLast();

$('#go').onclick=async()=>{
  if(busy||!canDraw)return;busy=true;const r=$('#res'),b=$('#go');b.disabled=true;
  const fail=m=>{r.textContent=m;b.disabled=!canDraw;busy=false};
  let n=null,t=null;
  if(testCode){if(!TL)return fail('測試連結無效或已過期');t=testDraw()}
  else{r.textContent='確認資格中…';const c=await claim();if(c.err)return fail(c.err);n=c.n}
  r.textContent='';
  await rain();n?await reveal(n):showResult(t);busy=false;};

function rain(){return new Promise(done=>{
  const G=$('#game'),cv=$('#cv'),ctx=cv.getContext('2d'),dpr=devicePixelRatio||1,W=innerWidth,H=innerHeight;
  G.hidden=false;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const E=[],P=[];let n=0,sp=0,last=performance.now();const t0=last;$('#cnt').textContent='搶到 0 個';
  cv.onpointerdown=ev=>{const x=ev.clientX,y=ev.clientY;
    for(let i=E.length-1;i>=0;i--){const e=E[i];if((x-e.x)**2+(y-e.y)**2<(e.s*.9)**2){E.splice(i,1);n++;P.push({x:e.x,y:e.y,t:0});$('#cnt').textContent='搶到 '+n+' 個';navigator.vibrate&&navigator.vibrate(15);break}}};
  const drawEnv=e=>{const w=e.s,h=w*1.3;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.r);
    ctx.fillStyle=e.g?'#f7b32b':'#e5252a';ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,-w/2,-h/2,w,h,w*.12);ctx.fill();
    ctx.fillStyle=e.g?'#d62828':'#f7b32b';ctx.beginPath();ctx.arc(0,-h*.12,w*.22,0,7);ctx.fill();
    ctx.fillStyle=e.g?'#f7b32b':'#d62828';ctx.font=`bold ${w*.28}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('福',0,-h*.12);ctx.restore()};
  (function f(now){const dt=Math.min(.05,(now-last)/1000);last=now;const el=(now-t0)/1000;ctx.clearRect(0,0,W,H);
    if(el<3){ctx.fillStyle='#fff';ctx.font='bold 120px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(Math.ceil(3-el),W/2,H/2);$('#tm').textContent='準備'}
    else{$('#tm').textContent=Math.max(0,Math.ceil(3+DUR-el))+' 秒';sp-=dt;
      if(sp<=0&&el<3+DUR-.8){sp=.22;E.push({x:30+Math.random()*(W-60),y:-60,v:H/3.2*(.7+Math.random()*.8),s:40+Math.random()*26,r:Math.random()-.5,w:Math.random()*2-1,g:Math.random()<.08})}}
    for(let i=E.length-1;i>=0;i--){const e=E[i];e.y+=e.v*dt;e.r+=e.w*dt;if(e.y>H+80){E.splice(i,1);continue}drawEnv(e)}
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.t+=dt;if(p.t>.6){P.splice(i,1);continue}
      ctx.globalAlpha=1-p.t/.6;ctx.fillStyle='#ffd166';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('+1',p.x,p.y-p.t*70);ctx.globalAlpha=1}
    if(el>=3+DUR){cv.onpointerdown=null;G.hidden=true;done();return}
    requestAnimationFrame(f)})(last)})}
</script></body></html>
